    # Merkmalsnamen. Ohne Anker traefe «ledig» auch in «lediglich» — deshalb
    # `anchor_required`. Ein- und Zweibuchstabenwerte («m», «w», «f») sind
    # bewusst NICHT im Muster: sie kommen ueberall vor.
    pattern: '(?i)(?:Evangelisch\-Reformierte\ Kirche|jüdische\ Glaubensgemeinschaft|sans\ appartenance\ religieuse|Chiesa\ evangelica\ riformata|Église\ évangélique\ réformée|Römisch\-katholische\ Kirche|israelitische\ Gemeinschaft|Église\ catholique\ romaine|no\ religious\ affiliation|Christkatholische\ Kirche|Chiesa\ cattolica\ romana|evangelisch\-reformiert|catholique\ chrétienne|comunità\ israelitica|communauté\ israélite|évangélique\ réformée|evangelica\ riformata|Protestant\ Reformed|cattolica\ cristiana|catholique\ romaine|Christian\ Catholic|römisch\-katholisch|senza\ confessione|christkatholisch|cattolica\ romana|Jewish\ community|sans\ confession|ohne\ Konfession|Roman\ Catholic|protestantisch|konfessionslos|altkatholisch|protestante)'
    anchor:
      required: true
      words: ['Konfession', 'Konfessionszugehörigkeit', 'Religion', 'confession', 'appartenance religieuse', 'confessione', 'religione', 'religious affiliation']
    anchor_same_line: true
    anchor_max_distance: 3

  SEX_KATALOG:
    tag: SEX
    stage: 2
    # Auspraegungen aus dem Amtlichen Katalog der Merkmale (BFS), verankert am
    # Merkmalsnamen. Ohne Anker traefe «ledig» auch in «lediglich» — deshalb
    # `anchor_required`. Ein- und Zweibuchstabenwerte («m», «w», «f») sind
    # bewusst NICHT im Muster: sie kommen ueberall vor.
    pattern: '(?i)(?:femminile|masculin|männlich|weiblich|maschile|féminin|female|male)'
    anchor:
      required: true
      words: ['Geschlecht', 'sexe', 'sesso', 'sex', 'gender']
    anchor_same_line: true
    anchor_max_distance: 3

  RESIDENCE_STATUS_KATALOG:
    tag: RESIDENCE_STATUS
    stage: 2
    # Auspraegungen aus dem Amtlichen Katalog der Merkmale (BFS), verankert am
    # Merkmalsnamen. Ohne Anker traefe «ledig» auch in «lediglich» — deshalb
    # `anchor_required`. Ein- und Zweibuchstabenwerte («m», «w», «f») sind
    # bewusst NICHT im Muster: sie kommen ueberall vor.
    pattern: '(?i)(?:domicilio\ principale|résidence\ secondaire|residenza\ principale|résidence\ principale|domicilio\ secondario|domicile\ secondaire|permanent\ residence|temporary\ residence|secondary\ residence|domicile\ principal|Wochenaufenthalt|niedergelassen|main\ residence|Niederlassung|Hauptwohnsitz|établissement|Nebenwohnsitz|Aufenthalt|domicilio|séjour|dimora)'
    anchor:
      required: true
      words: ['Meldeverhältnis', 'Meldeverhaeltnis', 'Wohnsitzart', "rapport d'annonce", 'type de domicile', 'rapporto di notifica', 'tipo di domicilio']
    anchor_same_line: true
    anchor_max_distance: 3

  SEX_KURZ:
    tag: SEX
    stage: 2
    # Formulare schreiben «Geschlecht: w», nicht «Geschlecht: weiblich».
    # Ein- und Zweibuchstabenwerte sind trotzdem sicher durch die ENGE Bindung:
    # Etikett zwingend, gleiche Zeile, Hoechstabstand 1 — also unmittelbar
    # hinter dem Etikett. «Die Wohnung ist 80 m gross» oder «Anhang f»
    # schlagen damit nicht an.
    pattern: '(?<![A-Za-zÄÖÜäöü])[mwfdMWFD](?![A-Za-zÄÖÜäöü])'
    anchor:
      required: true
      words: ['Geschlecht', 'sexe', 'sesso', 'sex', 'gender']
    anchor_same_line: true
    anchor_max_distance: 2
