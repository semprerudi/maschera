    placeholder: ORG
    budget: P
    bspd: false

  - tag: HEALTHCARE_ORG
    stage: 3
    action: mask
    placeholder: HEALTHCARE_ORG
    budget: R
    bspd: true
    note: Spezialklinik verrät mehr als die Diagnose

  # Aus dem IT-Support-Anwendungsfall: in Dateipfaden (/home/mmueller/),
  # Kontonamen, Protokollzeilen und Fehlermeldungen stehen Benutzernamen, und
  # die identifizieren eine Person ebenso wie ein Nachname. Budget R, weil ein
  # uebersehener Benutzername in einem Ticket direkt zur Person fuehrt.
  # Als letzter Eintrag ANGEHAENGT, wie der Vertrag es verlangt.
  - tag: USERNAME
    stage: 3
    action: mask
    placeholder: USERNAME
    budget: R
    bspd: false
    note: Kontoname, Pfadbestandteil, Anmeldename
