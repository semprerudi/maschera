# Das Docker-Abbild auf GHCR signieren — nur auf Knopfdruck, ohne Browser.
#
# Starten: «Actions», «Abbild signieren», «Run workflow», Digest eintragen —
# oder `gh workflow run abbild-signieren.yml -f digest=sha256:…`.
#
# Warum hier und nicht von Hand (Entscheid 17.10.2026): keyless `cosign sign`
# braucht am eigenen Rechner eine Anmeldung im Browser. Hier meldet sich der
# WORKFLOW selbst bei Sigstore an (OIDC von GitHub); niemand muss vor dem PC
# sitzen. Die Signatur traegt dann die Identitaet dieses Workflows statt der
# des Kontos — das README nennt beide.
#
# ⚠️ Er baut nichts und pusht kein Abbild. Er signiert genau den Digest, der
# eingetragen wird, und prueft die Signatur gleich danach. Der Digest geht
# ueber `env` in die Befehle, nie direkt als `${{ }}` in ein Skript — sonst
# waere das Eingabefeld eine Stelle, an der sich Shell-Befehle einschleusen
# liessen.
#
# Rechte: oben nur `contents: read` wie ueberall; der eine Job bekommt dazu
# `packages: write` (die Signatur liegt als Eintrag neben dem Abbild) und
# `id-token: write` (die Anmeldung bei Sigstore). Jede Action ist auf einen
# Commit festgenagelt.
name: Abbild signieren
on:
  workflow_dispatch:
    inputs:
      digest:
        description: "Digest des gepushten Abbilds, sha256:…"
        required: true

permissions:
  contents: read

jobs:
  signieren:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      ABBILD: ghcr.io/semprerudi/maschera
      DIGEST: ${{ inputs.digest }}
    steps:
      - name: Digest pruefen
        run: |
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Kein Digest: $DIGEST"
            exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Signieren
        run: cosign sign --yes "$ABBILD@$DIGEST"

      - name: Signatur pruefen
        run: |
          cosign verify "$ABBILD@$DIGEST" \
            --certificate-identity "https://github.com/semprerudi/maschera/.github/workflows/abbild-signieren.yml@refs/heads/main" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
