    placeholder: SOCIAL_INSURANCE
    budget: R
    bspd: true
    note: IV-Fall, Kassennummer

  - tag: INSURANCE_POLICY
    stage: 3
    action: mask
    placeholder: INSURANCE_POLICY
    budget: R
    bspd: true

  - tag: RESIDENCE_STATUS
    stage: 3
    action: mask
    placeholder: RESIDENCE_STATUS
    budget: A
    bspd: false
    note: Niederlassung / Aufenthalt

  - tag: VOTING_RIGHTS
    stage: 3
    action: mask
    placeholder: VOTING_RIGHTS
    budget: A
    bspd: false

  - tag: PLACE_OF_ORIGIN
    stage: 3
    action: mask
    placeholder: PLACE_OF_ORIGIN
    budget: R
    bspd: false
    note: >-
      mask, nicht tag_only. Der Heimatort verrät zwar nichts über den
      Wohnort, aber: das Schweizer
      Ortschaftenverzeichnis hängt Kantonskürzel an, um gleichnamige Orte zu
      unterscheiden ("Reute AR", "Benken SG"). Wohnorte sehen damit exakt aus
      wie Heimatorte, und die Fehlerrichtung war asymmetrisch — ein als
      Heimatort gelesener Wohnort blieb im Klartext, umgekehrt ging nur
      Kontext verloren. Solange ein nicht maskierendes Tag einem maskierenden
      zum Verwechseln ähnlich sieht, lecken Fehler in eine Richtung. Das ist
      nicht wegtrainierbar, weil die Formen an der Oberfläche identisch sind.

  - tag: CANTON
    stage: 3
    action: tag_only
    budget: P
    bspd: false
    note: trägt Kontext, identifiziert nicht

  - tag: ORG
    stage: 3
