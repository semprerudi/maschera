# Wöchentliche Prüfung der Abhängigkeiten und des Basisabbilds.
#
# ⚠️ `versioning-strategy: increase-if-necessary`. Ohne diese Zeile hebt
# Dependabot bei einer Untergrenze wie `>=3.1.6` jede Woche die ZAHL auf die
# neueste Fassung an — am ersten Tag zehn Pull Requests, darunter einer mit
# `torch>=2.14.1+cpu`, der gar nicht gilt. Die Untergrenzen hier sind die
# KLEINSTE Fassung ohne bekannte Lücke und bleiben es; angehoben wird nur,
# wenn die alte nicht mehr erlaubt wäre. Sicherheitsmeldungen gehen
# unabhängig davon über die Dependabot-Alarme des Repositories.
#
# `pip` zweimal: die Wurzel führt `requirements.txt` (ONNX-Weg) und
# `requirements-dev.txt`, `tools/paket/` führt die Listen der Pakete.
# Die Pakete ziehen torch von einem zweiten Index (`--extra-index-url`),
# den Dependabot ohne eigene Zugangsangabe nicht kennt — Vorschläge für
# torch sind dort mit Vorsicht zu lesen; die Untergrenzen in den Listen
# bleiben Handarbeit, geprüft mit `pip-audit`.
#
# `docker` für `tools/paket/Dockerfile`. Das Basisabbild bleibt bewusst bei
# Python 3.13: nur Patch-Fassungen werden vorgeschlagen. Ein Wechsel auf
# eine neuere Python ist eine Entscheidung des Maintainers, kein Vorschlag
# eines Bots.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/tools/paket"
    versioning-strategy: increase-if-necessary
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/tools/paket"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major",
                       "version-update:semver-minor"]
