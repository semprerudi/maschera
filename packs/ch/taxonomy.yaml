  # ---------------------------------------------------------------------------
  # Stufe 3 — rein neuronal (22)
  # ---------------------------------------------------------------------------

  - tag: FULLNAME
    stage: 3
    action: mask
    placeholder: FULLNAME
    budget: R
    bspd: false
    note: zentraler Identifikator, Dokument-Propagation setzt hier an

  - tag: GIVENNAME
    stage: 3
    action: mask
    placeholder: GIVENNAME
    budget: R
    bspd: false

  - tag: DATE
    stage: 3
    action: mask
    placeholder: DATE
    budget: R
    bspd: false
    note: vier Formatvarianten

  - tag: TIME
    stage: 3
    action: mask
    placeholder: TIME
    budget: R
    bspd: false

  - tag: STREET
    stage: 3
    action: mask
    placeholder: STREET
    budget: R
    bspd: false

  - tag: BUILDINGNUM
    stage: 3
    action: mask
    placeholder: BUILDINGNUM
    budget: R
    bspd: false

  - tag: CITY
    stage: 3
    action: mask
    placeholder: CITY
    budget: A
    bspd: false
