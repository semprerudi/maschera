# MASCHERA fuer macOS bauen — nur auf Knopfdruck, nichts wird veroeffentlicht.
#
# Starten: im Repository den Reiter «Actions», «macOS-Bau», «Run workflow».
# Ergebnis: ein Artefakt mit dem unsignierten `.dmg`, sieben Tage abrufbar.
#
# ⚠️ Der Bau ist neu und auf einem Mac noch nicht gemessen
# (`tools/paket/macos_bauen.py`, `tools/paket/MACOS.md` Abschnitt 6). Die
# Schritte «Anzeigeschicht» und «Rauchtest» liefern genau die Messwerte, die
# dort fehlen — sie brechen den Lauf nicht ab, damit man sie lesen kann.
#
# ⚠️ Kein Zeitplan, kein Push-Ausloeser: der Lauf holt 1,2 GB Modell und
# braucht rund eine Stunde. `contents: read` — der Workflow darf nichts
# schreiben. Jede Action ist auf einen Commit festgenagelt, nicht auf eine
# Marke, die sich verschieben liesse.
name: macOS-Bau
on: workflow_dispatch

permissions:
  contents: read

jobs:
  bauen:
    runs-on: macos-14   # Apple Silicon (arm64)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/paket/requirements-paket.txt
          pip install pywebview pyinstaller

      - name: Anzeigeschicht (Messwert fuer MACOS.md Abschnitt 6)
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys, importlib.metadata as m
          print("python", sys.version)
          print("pywebview", m.version("pywebview"))
          import webview
          print("platforms", getattr(webview, "platforms", None))
          try:
              import webview.platforms.cocoa  # noqa: F401
              print("cocoa: importierbar")
          except Exception as e:  # Messwert, kein Fehler des Laufs
              print("cocoa: NICHT importierbar:", type(e).__name__, e)
          PY

      - name: Modell holen (Pruefsumme aus packs/ch/modell.json)
        run: |
          python -c "
          from pathlib import Path
          from core import modell
          modell.hole(modell.manifest('ch'), Path('runs/ch-v63b'))
          print('Modell geholt')
          "

      - name: Bauen
        run: python tools/paket/macos_bauen.py

      - name: Rauchtest (Messwert fuer MACOS.md Abschnitt 6)
        continue-on-error: true
        run: |
          MASCHERA_PFAD="dist/macos-bau/dist/MASCHERA.app/Contents/MacOS/MASCHERA"
          "$MASCHERA_PFAD" --im-browser --port 4199 > rauchtest.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4199/api/zustand; then ok=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "Der Prozess ist beendet."; break; fi
            sleep 2
          done
          echo "--- Protokoll der App (letzte 80 Zeilen)"
          tail -80 rauchtest.log || true
          if kill -0 "$PID" 2>/dev/null; then echo "--- Prozess laeuft noch"; else echo "--- Prozess beendet"; fi
          if [ "$ok" != 1 ]; then
            echo "::warning title=Rauchtest::Der Server auf Port 4199 hat nicht geantwortet"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: rauchtest-log
          path: rauchtest.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MASCHERA-macOS-dmg
          path: dist/MASCHERA-*.dmg
          retention-days: 7
