# MASCHERA fuer macOS UND Windows bauen — nur auf Knopfdruck, nichts wird
# veroeffentlicht.
#
# Starten: im Repository den Reiter «Actions», «Pakete bauen», «Run workflow».
# Ergebnis: zwei Artefakte (das unsignierte `.dmg` und der unsignierte
# Windows-Installer), sieben Tage abrufbar. Dazu je eine Liste der
# eingepackten Paketfassungen (`pip freeze`), damit sich ein Bau mit einem
# anderen vergleichen laesst.
#
# Die Jobs sind unabhaengig: scheitert einer, laeuft der andere weiter.
#
# Seit dem 23.11.2026 zwei Mac-Pakete:
#   macos        arm64, torch, ab macOS 14
#   macos-intel  x86_64, onnxruntime 1.23.2, ab macOS 13.4. Fuer x86_64 gibt es
#                kein aktuelles torch; das Modell kommt als ONNX FP32 aus dem
#                Job `onnx-export`, der es auf Linux mit torch exportiert und
#                gegen torch prueft (`tools/onnx_vergleich.py --streng`: kein
#                Vertrauenswert darf an einer Schwelle kippen).
# Beide Mac-Jobs pruefen jede Programmdatei auf Architektur und Minimum
# (`tools/paket/macho_pruefen.py`) und vergleichen vier erfundene Briefe mit
# der Referenz (`tools/paket/referenz_pruefen.py`). Der Runner
# `macos-15-intel` ist der letzte x86_64-Runner von GitHub, bis etwa
# August 2027 (actions/runner-images#13045).
#
# ⚠️ Der Windows-Bau ist neu und mit dem Bau auf dem eigenen Windows-Rechner
# noch nicht verglichen (`tools/paket/WINDOWS.md`). Der Rauchtest ist eine
# Messung und bricht den Lauf nicht ab; das FENSTER laesst sich hier nicht
# ansehen (WINDOWS.md Abschnitt 5).
#
# ⚠️ Kein Zeitplan, kein Push-Ausloeser: jeder Lauf holt 1,2 GB Modell und
# braucht rund eine Stunde. `contents: read` — der Workflow darf nichts
# schreiben. Jede Action ist auf einen Commit festgenagelt, nicht auf eine
# Marke, die sich verschieben liesse.
name: Pakete bauen
on:
  workflow_dispatch:
  # `release.yml` ruft ihn auf; die Artefakte landen dann im selben Lauf.
  workflow_call:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15   # Apple Silicon (arm64). macos-14 ist seit 2.11.2026 abgeschaltet
    timeout-minutes: 120
    env:
      # Dieselbe Zahl wie `MINIMUM` in macos_bauen.py (test_fenster 33).
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      # Auf macOS ist torch von PyPI schon die CPU-Fassung (ohne `+cpu`);
      # ein zweiter Index braucht es nicht.
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/paket/requirements-paket.txt
          pip install "pywebview>=6.2.1,<7" pyinstaller

      - name: Anzeigeschicht (Messwert fuer MACOS.md Abschnitt 6)
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys, importlib.metadata as m
          print("python", sys.version)
          print("pywebview", m.version("pywebview"))
          import webview
          print("platforms", getattr(webview, "platforms", None))
          try:
              import webview.platforms.cocoa  # noqa: F401
              print("cocoa: importierbar")
          except Exception as e:  # Messwert, kein Fehler des Laufs
              print("cocoa: NICHT importierbar:", type(e).__name__, e)
          PY

      - name: Paketfassungen (zum Vergleichen)
        run: pip freeze > pakete-macos.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: paketfassungen-macos
          path: pakete-macos.txt
          retention-days: 7

      - name: Modell holen (Pruefsumme aus packs/ch/modell.json)
        run: |
          python -c "
          from pathlib import Path
          from core import modell
          modell.hole(modell.manifest('ch'), Path('runs/ch-v63b'))
          print('Modell geholt')
          "

      - name: Bauen
        run: python tools/paket/macos_bauen.py

      - name: Programmdateien (arm64, hoechstens macOS 14.0)
        run: python tools/paket/macho_pruefen.py dist/macos-bau/dist/MASCHERA.app --arch arm64 --minimum "$MACOSX_DEPLOYMENT_TARGET"

      - name: Rauchtest und Referenz
        run: |
          # Kein `--port`: `fenster.py` kennt die Option nicht, die Adresse kommt
          # aus den Einstellungen (Vorgabe 127.0.0.1:4141). Der erste Lauf scheiterte
          # daran, nicht am Paket.
          MASCHERA_PFAD="dist/macos-bau/dist/MASCHERA.app/Contents/MacOS/MASCHERA"
          "$MASCHERA_PFAD" --im-browser > rauchtest.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4141/api/zustand; then ok=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "Der Prozess ist beendet."; break; fi
            sleep 2
          done
          echo "--- Protokoll der App (letzte 80 Zeilen)"
          tail -80 rauchtest.log || true
          # Der Hilfsprozess von multiprocessing darf keine Fehlzeile mehr melden.
          if grep -q "unrecognized arguments" rauchtest.log; then
            echo "::warning title=Rauchtest::fenster.py meldet noch unbekannte Argumente (resource_tracker)"
          fi
          if kill -0 "$PID" 2>/dev/null; then echo "--- Prozess laeuft noch"; else echo "--- Prozess beendet"; fi
          if [ "$ok" != 1 ]; then
            echo "::error title=Rauchtest::Der Server auf Port 4141 hat nicht geantwortet"
            exit 1
          fi
          python tools/paket/referenz_pruefen.py http://127.0.0.1:4141
          kill "$PID" 2>/dev/null || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: rauchtest-log
          path: rauchtest.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: MASCHERA-macOS-dmg
          path: dist/MASCHERA-*.dmg
          retention-days: 7
          # Das .dmg ist schon komprimiert: ein zweites Mal zu packen kostet
          # Zeit beim Hochladen und beim Entpacken und spart nichts.
          compression-level: 0

  onnx-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      # torch einzeln vom CPU-Index und ohne Abhaengigkeiten (test_fenster 32);
      # onnxruntime auf DERSELBEN Fassung wie im Intel-Paket, damit der Vergleich
      # den Laeufer misst, der ausgeliefert wird.
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install torch --no-deps --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/paket/requirements-paket.txt "onnxruntime==1.23.2" onnx onnxscript
      - name: Modell holen (Pruefsumme aus packs/ch/modell.json)
        run: |
          python -c "
          from pathlib import Path
          from core import modell
          modell.hole(modell.manifest('ch'), Path('runs/ch-v63b'))
          "
      - name: Export ONNX FP32
        run: python tools/build_release.py --checkpoint runs/ch-v63b --out onnx-fp32 --no-trim --no-quantize
      - name: Vergleich mit torch (bricht ab, wenn etwas kippt)
        run: python tools/onnx_vergleich.py --torch runs/ch-v63b --onnx onnx-fp32 --streng
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: onnx-fp32
          path: onnx-fp32
          retention-days: 1
          compression-level: 0

  macos-intel:
    needs: onnx-export
    runs-on: macos-15-intel   # der letzte x86_64-Runner, bis etwa August 2027
    timeout-minutes: 120
    env:
      # Dieselbe Zahl wie `MINIMUM` in macos_bauen.py (test_fenster 33).
      MACOSX_DEPLOYMENT_TARGET: "13.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      # numpy ZUERST und fuer macOS 13: pip waehlt sonst auf dem macOS-15-Runner
      # das Rad fuer macOS 14 (erster Probelauf 23.11.2026). Danach ist numpy
      # erfuellt und wird nicht ersetzt. Ganz ueber `--platform` geht es nicht:
      # `proxy_tools` (von pywebview) gibt es nur als Quellpaket. Was sonst ein
      # zu neues Rad bringt, faengt `macho_pruefen.py` nach dem Bau.
      - name: Abhaengigkeiten (ohne torch, numpy fuer macOS 13)
        run: |
          python -m pip install --upgrade pip
          pip download numpy --no-deps --only-binary=:all: --platform macosx_13_0_x86_64 \
            --python-version 3.13 --implementation cp -d raeder
          pip install raeder/numpy-*.whl
          pip install -r tools/paket/requirements-macos-intel.txt "pywebview>=6.2.1,<7" pyinstaller
          pip freeze > pakete-macos-intel.txt
          python -c "import platform, onnxruntime; print(platform.machine(), 'onnxruntime', onnxruntime.__version__)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: paketfassungen-macos-intel
          path: pakete-macos-intel.txt
          retention-days: 7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: onnx-fp32
          path: onnx-fp32
      - name: Bauen
        env:
          MASCHERA_ONNX: onnx-fp32
        run: python tools/paket/macos_bauen.py
      - name: Programmdateien (x86_64, hoechstens macOS 13.4)
        run: python tools/paket/macho_pruefen.py dist/macos-bau/dist/MASCHERA.app --arch x86_64 --minimum "$MACOSX_DEPLOYMENT_TARGET"
      - name: Rauchtest und Referenz
        run: |
          MASCHERA_PFAD="dist/macos-bau/dist/MASCHERA.app/Contents/MacOS/MASCHERA"
          "$MASCHERA_PFAD" --im-browser > rauchtest.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4141/api/zustand; then ok=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "Der Prozess ist beendet."; break; fi
            sleep 2
          done
          tail -80 rauchtest.log || true
          [ "$ok" = 1 ] || { echo "::error title=Rauchtest Intel::Port 4141 antwortet nicht"; exit 1; }
          curl -fsS http://127.0.0.1:4141/api/zustand | grep -q '"modell": *"[^"]*onnx' \
            || { echo "::error title=Rauchtest Intel::das Paket rechnet nicht mit dem ONNX-Modell"; exit 1; }
          python tools/paket/referenz_pruefen.py http://127.0.0.1:4141
          kill "$PID" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: rauchtest-log-intel
          path: rauchtest.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: MASCHERA-macOS-intel-dmg
          path: dist/MASCHERA-*-x86_64.dmg
          retention-days: 7
          compression-level: 0

  # Ersatztest, kein echter Intel-Mac: das x86_64-Paket unter Rosetta 2 auf
  # Apple Silicon. Eine Messung, sie bricht den Lauf nicht ab.
  macos-intel-rosetta:
    needs: macos-intel
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: MASCHERA-macOS-intel-dmg
          path: dmg
      - name: Unter Rosetta starten
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          hdiutil attach dmg/MASCHERA-*-x86_64.dmg -mountpoint /Volumes/MASCHERA -nobrowse
          /Volumes/MASCHERA/MASCHERA.app/Contents/MacOS/MASCHERA --im-browser > rosetta.log 2>&1 &
          ok=0
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4141/api/zustand; then ok=1; break; fi
            sleep 2
          done
          tail -40 rosetta.log || true
          [ "$ok" = 1 ] || { echo "::warning title=Rosetta::Port 4141 antwortet nicht"; exit 1; }

  windows:
    runs-on: windows-latest   # x64
    timeout-minutes: 120
    defaults:
      run:
        shell: bash   # Git Bash — dieselben Schritte wie unter macOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"

      # ⚠️ torch ZUERST, einzeln und ohne Abhaengigkeiten vom CPU-Index
      # (WINDOWS.md Abschnitt 3); danach ist torch erfuellt und wird nicht
      # ersetzt, und seine Abhaengigkeiten kommen von PyPI.
      # `windows_bauen.py` bricht ohnehin ab, wenn kein `+cpu` dasteht.
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install torch --no-deps --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/paket/requirements-paket.txt "pywebview>=6.2.1,<7" pyinstaller pystray pillow
          pip freeze > pakete-windows.txt
          python -c "import importlib.metadata as m; print('torch', m.version('torch')); print('werkzeug', m.version('werkzeug'))"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: paketfassungen-windows
          path: pakete-windows.txt
          retention-days: 7

      # Chocolatey ist auf den Windows-Laeufern vorinstalliert; es legt
      # ISCC.exe unter «Program Files (x86)\Inno Setup 6», wo
      # `windows_bauen.py` (iscc()) sucht.
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Modell holen (Pruefsumme aus packs/ch/modell.json)
        run: |
          python -c "
          from pathlib import Path
          from core import modell
          modell.hole(modell.manifest('ch'), Path('runs/ch-v63b'))
          print('Modell geholt')
          "

      - name: Bauen
        run: python tools/paket/windows_bauen.py

      # Prueft nur, dass der eingefrorene Dienst startet und antwortet.
      - name: Rauchtest (Messwert, bricht den Lauf nicht ab)
        continue-on-error: true
        run: |
          EXE="dist/windows-bau/dist/MASCHERA/MASCHERA.exe"
          "$EXE" --im-browser > rauchtest.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4141/api/zustand; then ok=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "Der Prozess ist beendet."; break; fi
            sleep 2
          done
          tail -80 rauchtest.log || true
          taskkill //F //T //IM MASCHERA.exe 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "::error title=Rauchtest Windows::Port 4141 antwortet nicht"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: rauchtest-log-windows
          path: rauchtest.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: MASCHERA-Windows-setup
          path: dist/MASCHERA-*-x64-setup.exe
          retention-days: 7
          compression-level: 0   # das Modell liegt ohnehin unkomprimiert drin
