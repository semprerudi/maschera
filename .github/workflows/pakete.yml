# MASCHERA fuer macOS UND Windows bauen — nur auf Knopfdruck, nichts wird
# veroeffentlicht.
#
# Starten: im Repository den Reiter «Actions», «Pakete bauen», «Run workflow».
# Ergebnis: zwei Artefakte (das unsignierte `.dmg` und der unsignierte
# Windows-Installer), sieben Tage abrufbar. Dazu je eine Liste der
# eingepackten Paketfassungen (`pip freeze`), damit sich ein Bau mit einem
# anderen vergleichen laesst.
#
# Die beiden Jobs sind unabhaengig: scheitert einer, laeuft der andere weiter.
#
# ⚠️ Der Windows-Bau ist neu und mit dem Bau auf dem eigenen Windows-Rechner
# noch nicht verglichen (`tools/paket/WINDOWS.md`). Der Rauchtest ist eine
# Messung und bricht den Lauf nicht ab; das FENSTER laesst sich hier nicht
# ansehen (WINDOWS.md Abschnitt 5).
#
# ⚠️ Kein Zeitplan, kein Push-Ausloeser: jeder Lauf holt 1,2 GB Modell und
# braucht rund eine Stunde. `contents: read` — der Workflow darf nichts
# schreiben. Jede Action ist auf einen Commit festgenagelt, nicht auf eine
# Marke, die sich verschieben liesse.
name: Pakete bauen
on:
  workflow_dispatch:
  # `release.yml` ruft ihn auf; die Artefakte landen dann im selben Lauf.
  workflow_call:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14   # Apple Silicon (arm64)
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/paket/requirements-paket.txt
          pip install "pywebview>=6.2.1,<7" pyinstaller

      - name: Anzeigeschicht (Messwert fuer MACOS.md Abschnitt 6)
        continue-on-error: true
        run: |
          python - <<'PY'
          import sys, importlib.metadata as m
          print("python", sys.version)
          print("pywebview", m.version("pywebview"))
          import webview
          print("platforms", getattr(webview, "platforms", None))
          try:
              import webview.platforms.cocoa  # noqa: F401
              print("cocoa: importierbar")
          except Exception as e:  # Messwert, kein Fehler des Laufs
              print("cocoa: NICHT importierbar:", type(e).__name__, e)
          PY

      - name: Paketfassungen (zum Vergleichen)
        run: pip freeze > pakete-macos.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: paketfassungen-macos
          path: pakete-macos.txt
          retention-days: 7

      - name: Modell holen (Pruefsumme aus packs/ch/modell.json)
        run: |
          python -c "
          from pathlib import Path
          from core import modell
          modell.hole(modell.manifest('ch'), Path('runs/ch-v63b'))
          print('Modell geholt')
          "

      - name: Bauen
        run: python tools/paket/macos_bauen.py

      - name: Rauchtest (Messwert fuer MACOS.md Abschnitt 6)
        continue-on-error: true
        run: |
          # Kein `--port`: `fenster.py` kennt die Option nicht, die Adresse kommt
          # aus den Einstellungen (Vorgabe 127.0.0.1:4141). Der erste Lauf scheiterte
          # daran, nicht am Paket.
          MASCHERA_PFAD="dist/macos-bau/dist/MASCHERA.app/Contents/MacOS/MASCHERA"
          "$MASCHERA_PFAD" --im-browser > rauchtest.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4141/api/zustand; then ok=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "Der Prozess ist beendet."; break; fi
            sleep 2
          done
          echo "--- Protokoll der App (letzte 80 Zeilen)"
          tail -80 rauchtest.log || true
          # Der Hilfsprozess von multiprocessing darf keine Fehlzeile mehr melden.
          if grep -q "unrecognized arguments" rauchtest.log; then
            echo "::warning title=Rauchtest::fenster.py meldet noch unbekannte Argumente (resource_tracker)"
          fi
          if kill -0 "$PID" 2>/dev/null; then echo "--- Prozess laeuft noch"; else echo "--- Prozess beendet"; fi
          if [ "$ok" != 1 ]; then
            echo "::warning title=Rauchtest::Der Server auf Port 4141 hat nicht geantwortet"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: rauchtest-log
          path: rauchtest.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MASCHERA-macOS-dmg
          path: dist/MASCHERA-*.dmg
          retention-days: 7
          # Das .dmg ist schon komprimiert: ein zweites Mal zu packen kostet
          # Zeit beim Hochladen und beim Entpacken und spart nichts.
          compression-level: 0

  windows:
    runs-on: windows-latest   # x64
    timeout-minutes: 120
    defaults:
      run:
        shell: bash   # Git Bash — dieselben Schritte wie unter macOS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      # ⚠️ torch ZUERST und ausdruecklich vom CPU-Index (WINDOWS.md
      # Abschnitt 3). `requirements-paket.txt` sagt nur `--extra-index-url`;
      # danach ist torch schon erfuellt und wird nicht ersetzt.
      # `windows_bauen.py` bricht ohnehin ab, wenn kein `+cpu` dasteht.
      - name: Abhaengigkeiten
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r tools/paket/requirements-paket.txt "pywebview>=6.2.1,<7" pyinstaller pystray pillow
          pip freeze > pakete-windows.txt
          python -c "import importlib.metadata as m; print('torch', m.version('torch')); print('werkzeug', m.version('werkzeug'))"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: paketfassungen-windows
          path: pakete-windows.txt
          retention-days: 7

      # Chocolatey ist auf den Windows-Laeufern vorinstalliert; es legt
      # ISCC.exe unter «Program Files (x86)\Inno Setup 6», wo
      # `windows_bauen.py` (iscc()) sucht.
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Modell holen (Pruefsumme aus packs/ch/modell.json)
        run: |
          python -c "
          from pathlib import Path
          from core import modell
          modell.hole(modell.manifest('ch'), Path('runs/ch-v63b'))
          print('Modell geholt')
          "

      - name: Bauen
        run: python tools/paket/windows_bauen.py

      # Prueft nur, dass der eingefrorene Dienst startet und antwortet.
      - name: Rauchtest (Messwert, bricht den Lauf nicht ab)
        continue-on-error: true
        run: |
          EXE="dist/windows-bau/dist/MASCHERA/MASCHERA.exe"
          "$EXE" --im-browser > rauchtest.log 2>&1 &
          PID=$!
          ok=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4141/api/zustand; then ok=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "Der Prozess ist beendet."; break; fi
            sleep 2
          done
          tail -80 rauchtest.log || true
          taskkill //F //T //IM MASCHERA.exe 2>/dev/null || true
          [ "$ok" = 1 ] || { echo "::error title=Rauchtest Windows::Port 4141 antwortet nicht"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: rauchtest-log-windows
          path: rauchtest.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: MASCHERA-Windows-setup
          path: dist/MASCHERA-*-x64-setup.exe
          retention-days: 7
          compression-level: 0   # das Modell liegt ohnehin unkomprimiert drin
